<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julebrus Ranking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .boxes-container {
            margin-bottom: 30px;
            min-height: 100px;
        }

        .box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: move;
            user-select: none;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .box:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .box.dragging {
            opacity: 0.5;
        }

        .box.drag-over {
            border: 2px dashed #333;
        }

        .controls {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .instructions {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .instructions p {
            margin-bottom: 5px;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎄 Julebrus Ranking 🎄</h1>
        <p class="subtitle">Rangér julebrusene fra best (øverst) til dårligst (nederst)</p>

        <div class="instructions">
            <p><strong>Instruksjoner:</strong></p>
            <p>• Dra og slipp boksene for å rangere dem</p>
            <p>• Skriv inn navnet ditt og klikk "Lagre"</p>
        </div>

        <div class="boxes-container" id="boxesContainer">
            {% for item in kodenavn %}
            <div class="box" draggable="true" data-kodenavn="{{ item }}">{{ item }}</div>
            {% endfor %}
        </div>

        <div class="controls">
            <div class="form-group">
                <label for="navn">Navn:</label>
                <input type="text" id="navn" name="navn" placeholder="Skriv navnet ditt her">
            </div>
            <button onclick="saveOrder()">Lagre min rangering</button>
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        // Drag and drop functionality
        const boxesContainer = document.getElementById('boxesContainer');
        const boxes = boxesContainer.querySelectorAll('.box');

        let draggedElement = null;

        boxes.forEach(box => {
            box.addEventListener('dragstart', handleDragStart);
            box.addEventListener('dragend', handleDragEnd);
            box.addEventListener('dragover', handleDragOver);
            box.addEventListener('drop', handleDrop);
            box.addEventListener('dragenter', handleDragEnter);
            box.addEventListener('dragleave', handleDragLeave);
        });

        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            // Remove drag-over class from all boxes
            boxes.forEach(box => box.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            if (this !== draggedElement) {
                this.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (draggedElement !== this) {
                // Get all boxes
                const allBoxes = Array.from(boxesContainer.children);
                const draggedIndex = allBoxes.indexOf(draggedElement);
                const targetIndex = allBoxes.indexOf(this);

                if (draggedIndex < targetIndex) {
                    this.parentNode.insertBefore(draggedElement, this.nextSibling);
                } else {
                    this.parentNode.insertBefore(draggedElement, this);
                }
            }

            this.classList.remove('drag-over');
            return false;
        }

        function saveOrder() {
            const navn = document.getElementById('navn').value.trim();
            const messageDiv = document.getElementById('message');

            if (!navn) {
                showMessage('Vennligst skriv inn navnet ditt', 'error');
                return;
            }

            // Get the current order
            const boxes = boxesContainer.querySelectorAll('.box');
            const order = Array.from(boxes).map(box => box.dataset.kodenavn);

            // Send to server
            fetch('/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    navn: navn,
                    order: order
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let message = `Rangeringen din er lagret! (${data.file})`;
                        if (data.warning) {
                            message += ` - ${data.warning}`;
                        }
                        showMessage(message, 'success');
                    } else {
                        showMessage('Feil: ' + (data.error || 'Ukjent feil'), 'error');
                    }
                })
                .catch(error => {
                    showMessage('Feil ved lagring: ' + error, 'error');
                });
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            // Hide message after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Allow Enter key to submit
        document.getElementById('navn').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                saveOrder();
            }
        });
    </script>
</body>

</html>
